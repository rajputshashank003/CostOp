name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "health_api/**"

jobs:
  filter:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      health_api: ${{ steps.filter.outputs.health_api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            health_api:
              - 'health_api/**'

  deploy:
    name: Build & Deploy API
    needs: filter
    if: needs.filter.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v4
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/costop-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/costop-api:${{ github.sha }}

      - name: Trigger Render deploy
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
        run: curl --fail-with-body -X POST "$RENDER_API_DEPLOY_HOOK"

  health-cron:
    name: Build & Push Health Cron Image
    needs: filter
    if: needs.filter.outputs.health_api == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push api-health-cron image
        uses: docker/build-push-action@v4
        with:
          context: ./health_api
          file: ./health_api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/api-health-cron:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/api-health-cron:${{ github.sha }}

      - name: Trigger Health API Render deploy
        env:
          COSTOP_HEALTH_DEPLOY_HOOK: ${{ secrets.COSTOP_HEALTH_DEPLOY_HOOK }}
        run: curl --fail-with-body -X POST "$COSTOP_HEALTH_DEPLOY_HOOK"
