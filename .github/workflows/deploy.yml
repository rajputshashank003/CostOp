name: Deploy API

on:
  push:
    branches: [staging]

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      health_api: ${{ steps.filter.outputs.health_api }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'

  deploy:
    name: Build & Deploy API
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push API image
        uses: docker/build-push-action@v4
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/costop-api-s:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/costop-api-s:${{ github.sha }}

      - name: Trigger Render deploy
        env:
          RENDER_API_DEPLOY_HOOK_STAGING: ${{ secrets.RENDER_API_DEPLOY_HOOK_STAGING }}
        run: curl --fail-with-body -X POST "$RENDER_API_DEPLOY_HOOK_STAGING"
